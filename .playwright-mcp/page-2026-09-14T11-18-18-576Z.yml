      - paragraph [ref=e367]: We’re Phu, Tai, and Luc, three friends who started Innoir at D13 An Thuong 34. That little corner of Da Nang means a lot to us. It’s where we learned how much we enjoy building something together, and where the idea for Inside Out began.
      - paragraph [ref=e368]: With Inside Out, we’re making the kind of streetwear we want in our own wardrobes. We care about how the fabric feels, how a piece fits, and whether you’ll reach for it again tomorrow. We wear what we sell, so those details matter to us. Come by, try something on, and say hello. We’d love to meet you.
